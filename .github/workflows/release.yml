name: Release

# Pushing a tag is the whole trigger: `pnpm run release` makes the tag, this
# builds it. The GitHub release is left as a draft, so nothing reaches anyone
# until it is published by hand — which is also what updates the Homebrew tap
# (see tap.yml).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.1
        required: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is missing on purpose. It is built by `pnpm run release:macos`
          # on a Mac that already holds the Developer ID key, so the key is
          # never copied into a CI secret. An unsigned .dmg built here would be
          # worse than none: it downloads fine and then tells the player the
          # app is damaged.
          - name: Linux
            platform: ubuntu-22.04
            args: ""
            targets: ""
          - name: Windows
            platform: windows-latest
            args: ""
            targets: ""

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: NetHack Tiles Client ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Download the build for your platform below.

            The macOS .dmg is signed and notarised, so it opens like any other
            app. The Windows .msi is unsigned, so SmartScreen asks for
            "More info > Run anyway" on the first launch.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
